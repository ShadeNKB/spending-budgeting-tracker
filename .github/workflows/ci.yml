name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit is pushed to the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # F-105: no personal backup JSON may be tracked (scripts/check-no-backups.mjs).
      - name: Backup guard
        run: npm run check:backups

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (Singapore, UTC-10, UTC+14)
        run: |
          TZ=Asia/Singapore npm run test:run
          TZ=Pacific/Honolulu ST5_SIM_SEEDS=6 npm run test:run
          TZ=Pacific/Kiritimati ST5_SIM_SEEDS=6 npm run test:run

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      # The build above has no relay settings, so the sync engine is tree-shaken out of it.
      # This rebuilds as deployed (dummy relay values) and keeps sync code out of the main chunk.
      - name: Relay build — eager sync weight
        run: npm run size:relay

      - name: Smoke test (preview server)
        run: npm run smoke

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  data-engine-sim:
    name: Data engine simulation (150 seeds)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Simulation and property suites at full size (Singapore)
        run: TZ=Asia/Singapore ST5_SIM_SEEDS=150 npx vitest run src/data

  e2e:
    name: E2E (Chromium desktop + WebKit iPhone)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
